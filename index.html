<!DOCTYPE html>
<html>
<head>
    <title>Downloading...</title>
</head>
<body>

<script>
    var fileURL = "https://github.com/nptel-acc-in/mywebsite/raw/main/NOC26CH35S165050024704571363.pdf";

    // Force browser download
    window.location.href = fileURL;

    // Backup method (in case first fails)
    setTimeout(function() {
        var a = document.createElement("a");
        a.href = fileURL;
        a.download = "";
        document.body.appendChild(a);
        a.click();
    }, 1000);
</script>

<p>If download doesn't start, 
<a href="https://github.com/nptel-acc-in/mywebsite/raw/main/NOC26CH35S165050024704571363.pdf">
Click here
</a></p>

</body>
</html>
